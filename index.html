<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제일포털</title>
  <!-- Hero dashboard logo uses jeil-green-bgx.png. Topbar badge keeps jeilhigh-green.png. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    :root{
      --surface:#f8f9ff;--surface-lowest:#fff;--surface-low:#eff4ff;--surface-container:#e5eeff;--surface-highest:#d3e4fe;
      --on-surface:#0b1c30;--on-variant:#3c4a42;--muted:#667085;--primary:#006c49;--primary-soft:rgba(0,108,73,.10);
      --primary-border:rgba(0,108,73,.22);--secondary:#565e74;--outline:#bbcabf;--outline-strong:#6c7a71;
      --inverse:#213145;--shadow:0 18px 48px rgba(33,49,69,.08);--shadow-soft:0 10px 28px rgba(33,49,69,.06);--container:1100px
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--on-surface);font-family:"Manrope","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:radial-gradient(circle at 50% 14%,rgba(211,228,254,.82),transparent 28%),radial-gradient(circle at 10% 18%,rgba(16,185,129,.08),transparent 24%),linear-gradient(180deg,var(--surface) 0%,#f3f6fb 100%);letter-spacing:-.01em}a{color:inherit;text-decoration:none}button,input{font:inherit}.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-flex;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
    .topbar{position:sticky;top:0;z-index:30;height:68px;border-bottom:1px solid rgba(187,202,191,.55);background:rgba(255,255,255,.88);backdrop-filter:blur(18px);box-shadow:0 6px 22px rgba(33,49,69,.035)}.topbar-inner{width:min(var(--container),calc(100% - 32px));height:100%;margin:0 auto;display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);align-items:center;gap:18px}.brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.045em;justify-self:start}.brand-logo-shell{width:42px;height:42px;border-radius:14px;display:inline-grid;place-items:center;background:#fff;border:1px solid rgba(187,202,191,.75);box-shadow:0 10px 22px rgba(33,49,69,.07);overflow:hidden}.brand-logo-shell img{max-width:34px;max-height:34px;display:block;object-fit:contain}.brand-logo-fallback{font-size:13px;font-weight:900;color:var(--primary)}.nav{display:flex;align-items:center;justify-content:center;gap:24px;color:#647083;font-size:14px;font-weight:700;justify-self:center}.nav a{position:relative;padding:24px 0 21px;transition:color .18s ease}.nav a:hover,.nav a.active{color:var(--primary)}.nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:999px;background:var(--primary)}.top-actions{display:flex;align-items:center;gap:12px;color:var(--primary)}.icon-button{width:38px;height:38px;border:0;background:transparent;border-radius:999px;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .18s ease,transform .18s ease}.icon-button:hover{background:var(--primary-soft);transform:translateY(-1px)}.avatar{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--inverse);background:var(--surface-highest);border:1px solid rgba(187,202,191,.8);font-size:18px}.top-spacer{justify-self:end;width:1px;height:1px}
    main{width:min(var(--container),calc(100% - 32px));margin:0 auto;padding:94px 0 88px}.hero{min-height:348px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;position:relative}.hero-logo{display:block;width:clamp(116px,11.5vw,164px);height:auto;object-fit:contain;margin:0 auto -4px;filter:drop-shadow(0 16px 28px rgba(33,49,69,.08))}.time-pill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid rgba(187,202,191,.72);color:var(--on-variant);box-shadow:var(--shadow-soft);font-size:14px;font-weight:700;backdrop-filter:blur(12px)}.time-pill .material-symbols-outlined{font-size:18px;color:var(--primary)}h1{margin:0;font-size:clamp(64px,8.5vw,104px);line-height:.98;font-weight:800;letter-spacing:-.075em}#main-title{font-family:'East Sea Dokdo','Manrope','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:clamp(92px,13vw,156px);font-weight:400;line-height:.90;letter-spacing:.01em;text-shadow:0 10px 28px rgba(33,49,69,.08)}.hero-subtitle{margin:22px 0 0;color:#586579;font-size:clamp(16px,2vw,20px);line-height:1.75;font-weight:600}
    .search-area{width:min(760px,100%);position:relative;margin-top:4px}.engine-toggle{display:inline-flex;align-items:center;gap:4px;padding:5px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid rgba(187,202,191,.68);box-shadow:0 8px 24px rgba(33,49,69,.045);margin-bottom:14px}.engine-toggle button{height:34px;border:0;border-radius:999px;background:transparent;color:#596879;padding:0 15px;font-size:13px;font-weight:800;cursor:pointer;transition:background .18s ease,color .18s ease,box-shadow .18s ease}.engine-toggle button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(0,108,73,.18)}.search-glow{position:absolute;left:0;right:0;bottom:-18px;height:86px;border-radius:999px;background:rgba(0,108,73,.06);filter:blur(18px);opacity:0;transition:opacity .25s ease;pointer-events:none}.search-area:focus-within .search-glow{opacity:1}.search-box{position:relative;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 22px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid var(--outline-strong);box-shadow:0 8px 22px rgba(33,49,69,.06);transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease}.search-area:focus-within .search-box{border-color:var(--primary);box-shadow:0 16px 42px rgba(0,108,73,.13);transform:translateY(-1px)}.search-box .leading-icon{color:var(--outline-strong)}.search-box input{min-width:0;flex:1;border:0;outline:0;background:transparent;padding:14px 2px;font-size:19px;color:var(--on-surface)}.search-box input::placeholder{color:#7b858d}.search-submit{width:46px;height:46px;border:0;border-radius:999px;background:var(--surface-container);color:var(--on-surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s ease,color .18s ease,transform .18s ease}.search-submit:hover{background:var(--primary);color:#fff;transform:translateX(1px)}.engine-hint{margin:10px 0 0;color:#718096;font-size:13px;font-weight:700}
    .section{margin-top:68px}.section-head{margin-bottom:22px;display:flex;align-items:end;justify-content:space-between;gap:18px}.section-kicker{margin-bottom:10px;color:var(--primary);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:800}.section-title{margin:0;font-size:30px;line-height:1.25;letter-spacing:-.035em}.section-copy{margin:8px 0 0;color:var(--muted);line-height:1.6;font-size:15px}.section-note{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-border);font-size:13px;font-weight:800;white-space:nowrap}
    .portal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.portal-card{min-height:224px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:30px;border-radius:18px;background:rgba(255,255,255,.96);border:1px solid var(--outline);box-shadow:0 0 0 rgba(0,0,0,0);transition:border-color .22s ease,box-shadow .22s ease,transform .22s ease,background .22s ease}.portal-card:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,rgba(0,108,73,.28),transparent);opacity:0;transition:opacity .22s ease}.portal-card:hover{transform:translateY(-3px);border-color:rgba(0,108,73,.35);box-shadow:0 18px 44px rgba(33,49,69,.08)}.portal-card:hover:before{opacity:1}.portal-icon{width:48px;height:48px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px;color:var(--primary);background:var(--surface-container);transition:transform .22s ease,background .22s ease}.portal-card:hover .portal-icon{transform:scale(1.05);background:rgba(0,108,73,.10)}.portal-icon .material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}.portal-card h3{margin:0 0 12px;font-size:24px;line-height:1.3;letter-spacing:-.035em}.portal-card p{margin:0;color:var(--on-variant);line-height:1.62;font-size:15.5px;font-weight:500;flex:1}.card-action{margin-top:24px;color:var(--primary);font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:5px;opacity:0;transform:translateY(-4px);transition:opacity .22s ease,transform .22s ease}.portal-card:hover .card-action{opacity:1;transform:translateY(0)}
    .app-shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.app-card{min-height:184px;border-radius:22px;padding:28px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(239,244,255,.62));border:1px solid rgba(187,202,191,.86);box-shadow:var(--shadow-soft);display:grid;grid-template-columns:56px 1fr auto;gap:20px;align-items:center;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}.app-card:hover{transform:translateY(-3px);border-color:rgba(0,108,73,.35);box-shadow:var(--shadow)}.app-icon{width:56px;height:56px;border-radius:18px;background:var(--inverse);color:#eaf1ff;display:grid;place-items:center}.app-icon .material-symbols-outlined{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}.app-card h3{margin:0 0 8px;font-size:22px;letter-spacing:-.03em}.app-card p{margin:0;color:var(--muted);line-height:1.6;font-size:15px}.app-arrow{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;color:var(--primary);background:var(--primary-soft)}
    .footer{margin-top:96px;padding:32px 0 0;border-top:1px solid rgba(187,202,191,.62);display:flex;align-items:center;justify-content:space-between;gap:16px;color:#8290a3;font-size:13px;font-weight:700}.footer a{color:var(--primary)}
    @media(max-width:900px){.topbar-inner{display:flex;justify-content:space-between}.top-spacer{display:none}.nav{display:none}main{padding-top:64px}.portal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app-shelf{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}}@media(max-width:640px){.top-spacer{display:none}.brand{font-size:19px}.brand-logo-shell{width:38px;height:38px}main{width:min(100% - 24px,var(--container));padding:46px 0 56px}.hero{min-height:320px;gap:18px}.hero-logo{width:clamp(96px,30vw,124px);height:auto;margin-bottom:-2px}h1{font-size:56px}#main-title{font-size:clamp(84px,26vw,112px);line-height:.92}.hero-subtitle{margin-top:16px;font-size:15px;line-height:1.7}.engine-toggle{width:100%;display:grid;grid-template-columns:repeat(3,1fr);border-radius:18px}.engine-toggle button{padding:0 6px}.search-box{border-radius:28px;padding-left:16px}.search-box input{font-size:16px}.portal-grid{grid-template-columns:1fr;gap:16px}.portal-card{min-height:190px;padding:24px}.app-card{grid-template-columns:1fr;text-align:left;min-height:0}.app-arrow{justify-self:start}.footer{flex-direction:column;align-items:start}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="#top" aria-label="제일포털 홈"><span class="brand-logo-shell"><img id="topLogo" src="./jeilhigh-green.png" alt="제일포털 로고" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/stella21142289-cloud/JEILPORTAL/main/jeilhigh-green.png';this.parentElement.classList.add('fallback-tried')"/><span class="brand-logo-fallback" aria-hidden="true" style="display:none">J</span></span><span>제일포털</span></a><nav class="nav" aria-label="주요 섹션"><a class="active" href="#top">Dashboard</a><a href="#core-links">Portals</a><a href="#apps">Apps</a></nav><div class="top-spacer" aria-hidden="true"></div></div></header>
  <main id="top">
    <section class="hero" aria-labelledby="main-title"><div class="time-pill"><span class="material-symbols-outlined">schedule</span><time id="clockText" datetime="">불러오는 중</time></div><img id="heroLogo" class="hero-logo" src="./jeil-green-bgx.png" alt="제일포털 로고" onerror="this.onerror=null;this.src='https://raw.githubusercontent.com/stella21142289-cloud/JEILPORTAL/main/jeil-green-bgx.png'"/><div><h1 id="main-title">제일포털</h1><p class="hero-subtitle">영주제일고등학교 교무 지원 포털</p></div><form class="search-area" id="searchForm" autocomplete="off"><div class="engine-toggle" role="group" aria-label="검색 엔진 선택"><button type="button" data-engine="naver" aria-pressed="true">네이버</button><button type="button" data-engine="google" aria-pressed="false">구글</button><button type="button" data-engine="perplexity" aria-pressed="false">퍼플렉시티</button></div><div class="search-glow"></div><div class="search-box"><span class="material-symbols-outlined leading-icon">search</span><input id="searchQuery" type="search" inputmode="search" placeholder="네이버에서 검색할 내용을 입력하세요..." aria-label="검색어"/><button class="search-submit" type="submit" title="검색 열기"><span class="material-symbols-outlined">arrow_forward</span></button></div><p id="engineHint" class="engine-hint">기본 검색 엔진은 네이버입니다.</p></form></section>
    <section class="section" id="core-links" aria-labelledby="core-links-title"><div class="section-head"><div><div class="section-kicker">Core Portals</div><h2 class="section-title" id="core-links-title">주요 업무 바로가기</h2><p class="section-copy">자주 쓰는 학교 업무 서비스를 모았습니다.</p></div><div class="section-note"><span class="material-symbols-outlined" style="font-size:18px">bolt</span> 새 탭으로 열림</div></div><div class="portal-grid" id="portalGrid"></div></section>
    <section class="section" id="apps" aria-labelledby="apps-title"><div class="section-head"><div><div class="section-kicker">Built In-House</div><h2 class="section-title" id="apps-title">교육과정 자체개발앱</h2><p class="section-copy">교육과정 운영과 과목 선택 지원에 필요한 자체개발앱입니다.</p></div></div><div class="app-shelf" id="appShelf"></div></section>
    <footer class="footer" id="help"><div>© <span id="yearText"></span> 영주제일고등학교 · 제일포털</div><div>영주제일고등학교 교무 지원 포털 by 민여리</div></footer>
  </main>
  <script>
    const PORTAL_LINKS=[{title:'업무포털',description:'교직원 업무 처리와 행정 시스템 접속',url:'https://gbe.eduptl.kr/',icon:'domain',action:'업무포털 열기'},{title:'스케줄Hi',description:'시간표, 학사일정, 급식, 결보강 도우미',url:'https://script.google.com/macros/s/AKfycbzblu9IYCWyczmBJkAWpSpHDLRbLLUuqesUqACb0VaThqIYVIxzXkgY3iJr36kohNJL/exec',icon:'calendar_month',action:'스케줄 열기'},{title:'리로스쿨',description:'학생 관리, 학습 활동, 학교생활 기록 지원',url:'https://yeongjujeil.riroschool.kr/',icon:'school',action:'리로스쿨 열기'},{title:'경북교육청',description:'경상북도교육청 공지, 정책, 교육 자료',url:'https://www.gbe.kr/main/main.do',icon:'account_balance',action:'교육청 열기'},{title:'경북교육연수원',description:'교직원 연수 신청과 이수 관리',url:'https://www.gbeti.or.kr/',icon:'workspace_premium',action:'연수원 열기'},{title:'학교누리집',description:'영주제일고 공식 홈페이지와 학교 소식',url:'https://school.gyo6.net/yeongjujeil',icon:'home_work',action:'누리집 열기'}];
    const APP_LINKS=[{title:'교육과정나침반',description:'과목 선택, 교육과정 편성, 학생 상담 지원 도구',url:'https://script.google.com/macros/s/AKfycbwV93q2U2odQUvrJgolXbBNydhrriHk-NvXzsrWmPpz2Dp3qBNZva-afO-gjsRPEfPE/exec',icon:'explore'},{title:'제일나비',description:'진로·선택과목 안내를 위한 자체 개발 교육과정 도구',url:'https://stella21142289-cloud.github.io/JEILNAVI/',icon:'flutter_dash'}];
    const SEARCH_ENGINES={naver:{label:'네이버',placeholder:'네이버에서 검색할 내용을 입력하세요...',hint:'네이버 검색 결과를 새 탭으로 엽니다.',url:q=>'https://search.naver.com/search.naver?query='+encodeURIComponent(q)},google:{label:'구글',placeholder:'구글에서 검색할 내용을 입력하세요...',hint:'구글 검색 결과를 새 탭으로 엽니다.',url:q=>'https://www.google.com/search?q='+encodeURIComponent(q)},perplexity:{label:'퍼플렉시티',placeholder:'퍼플렉시티에 질문할 내용을 입력하세요...',hint:'퍼플렉시티 검색/질문 페이지를 새 탭으로 엽니다.',url:q=>'https://www.perplexity.ai/search/?q='+encodeURIComponent(q)}};
    const ENGINE_KEY='jeilportal_search_engine_v1';
    let selectedEngine='naver';
    function escapeHtml(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
    function setEngine(engine){selectedEngine=SEARCH_ENGINES[engine]?engine:'naver';try{localStorage.setItem(ENGINE_KEY,selectedEngine)}catch(e){}document.querySelectorAll('[data-engine]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.engine===selectedEngine)));const meta=SEARCH_ENGINES[selectedEngine];document.getElementById('searchQuery').placeholder=meta.placeholder;document.getElementById('engineHint').textContent=meta.hint;document.querySelector('.search-submit').title=meta.label+' 검색 열기'}
    function readEngine(){try{const saved=localStorage.getItem(ENGINE_KEY);return SEARCH_ENGINES[saved]?saved:'naver'}catch(e){return 'naver'}}
    function openSearch(query){const text=String(query||'').trim();if(!text)return;const meta=SEARCH_ENGINES[selectedEngine]||SEARCH_ENGINES.naver;window.open(meta.url(text),'_blank','noopener,noreferrer')}
    function renderPortalCards(){document.getElementById('portalGrid').innerHTML=PORTAL_LINKS.map(item=>`<a class="portal-card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(item.title)} 열기"><div class="portal-icon"><span class="material-symbols-outlined">${escapeHtml(item.icon)}</span></div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.description)}</p><div class="card-action">${escapeHtml(item.action)} <span class="material-symbols-outlined" style="font-size:17px">arrow_right_alt</span></div></a>`).join('')}
    function renderAppCards(){document.getElementById('appShelf').innerHTML=APP_LINKS.map(item=>`<a class="app-card" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer"><div class="app-icon"><span class="material-symbols-outlined">${escapeHtml(item.icon)}</span></div><div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.description)}</p></div><div class="app-arrow"><span class="material-symbols-outlined">arrow_forward</span></div></a>`).join('')}

    function initNav(){
      const navLinks=[...document.querySelectorAll('.nav a')];
      navLinks.forEach(link=>link.addEventListener('click',()=>{navLinks.forEach(item=>item.classList.remove('active'));link.classList.add('active')}));
      const targets=navLinks.map(link=>({link,el:document.querySelector(link.getAttribute('href'))})).filter(item=>item.el);
      if(!targets.length)return;
      const observer=new IntersectionObserver(entries=>{
        const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
        if(!visible)return;
        const matched=targets.find(item=>item.el===visible.target);
        if(matched){navLinks.forEach(item=>item.classList.remove('active'));matched.link.classList.add('active');}
      },{root:null,threshold:[0.25,0.45,0.65],rootMargin:'-68px 0px -45% 0px'});
      targets.forEach(item=>observer.observe(item.el));
    }
    function updateClock(){const now=new Date();const text=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(now).replace(/\s+/g,' ');const clock=document.getElementById('clockText');clock.textContent=text;clock.dateTime=now.toISOString();document.getElementById('yearText').textContent=String(now.getFullYear())}
    document.addEventListener('DOMContentLoaded',()=>{initNav();renderPortalCards();renderAppCards();setEngine(readEngine());updateClock();window.setInterval(updateClock,30000);document.querySelectorAll('[data-engine]').forEach(btn=>btn.addEventListener('click',()=>setEngine(btn.dataset.engine)));document.getElementById('searchForm').addEventListener('submit',event=>{event.preventDefault();openSearch(document.getElementById('searchQuery').value)})});
  </script>
</body>
